# https://docs.fluentbit.io/manual/pipeline/filters/kubernetes
# kubernetes过滤器

[FILTER]
    Name             kubernetes
    Match            kube.*

    # Kube_URL
    # ============
    # API server端点
    #
    Kube_URL         https://kubernetes.default.svc:443

    # Kube_CA_File
    # ============
    # CA证书
    #
    Kube_CA_File     /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    # Kube_CA_Path
    # ============
    # 扫描CA证书
    #
    #Kube_CA_Path     

    # Kube_Token_File
    # ============
    # 令牌文件获取路径
    # 也可以使用Kube_Token_Command
    #
    Kube_Token_File  /var/run/secrets/kubernetes.io/serviceaccount/token

    # Kube_Tag_Prefix
    # ============
    # 当源记录来自Tail输入插件时，此选项允许指定Tail配置中使用的前缀。
    #
    Kube_Tag_Prefix  kube.var.log.containers.

    # Merge_Log
    # ============
    # 启用后，它会检查log字段内容是否为JSON string map，
    # 如果是，则将映射字段追加为日志结构的一部分
    #
    Merge_Log        On

    # Merge_Log_Key
    # ============
    # 如果启用Merge_Log，过滤器会尝试假定传入消息中的log字段是JSON字符串消息，
    # 并在映射中字段log的同一级别对其进行结构化解码。
    # 如果 Merge_Log_Key设置了（字符串名称），则从原始log内容中获取的所有新结构化字段都将插入到新键下。
    #
    Merge_Log_Key    log_processed

    # Merge_Log_Trim
    # ============
    # 如果启用Merge_Log, 删除字段值内`\r`和`\n`
    #
    #Merge_Log_Trim    On

    # Keep_Log
    # ============
    # 如果启用Merge_Log,且禁用了Keep_Log,`log`字段将从传递的消息中移除.
    #
    # Keep_Log    On

    # tls.debug
    # ============
    # 调试级别。
    # 范围[0:4],分别代表无和每个细节
    #
    #tls.debug    -1

    # tls.verify
    # ============
    # 开启证书验证
    #
    #tls.verify    On

    # Buffer_Size
    # ============
    # 设置从 Kubernetes API 服务器读取响应时HTTP客户端的缓冲区大小
    # 0表示没有限制, 默认为32k.
    # 当Pod的规格超过限制, 则丢弃数据，部分元数据不会注入到日志
    #
    # Buffer_Size 32k

    # Use_Journal
    # ============
    # filter将读取Journald格式的日志
    #
    # Use_Journal Off

    # Regex_Parser
    # ============
    # 设置备用解析器以处理记录标记并提取pod_name、namespace_name、container_name和docker_id
    # 解析器必须在parsers.conf文件中注册
    # 
    # Regex_Parser 

    
    # K8S-Logging.Parser 
    # ============
    # 允许kuberetes pod通过annotation指定解析器
    # 默认Off
    # 
    # K8S-Logging.Parser Off 

    # K8S-Logging.Exclude 
    # ============
    # 允许kuberetes pod通过annotation指定是否忽略当前pod日志
    # 默认Off
    # 
    # K8S-Logging.Exclude Off 

    # Labels  
    # ============
    # 在额外的元数据中包含 Kubernetes Pod Annotations
    # 默认On
    # 
    # Labels  On

    # Kube_meta_preload_cache_dir  
    # ============
    # 如果设置，则可以从此目录中以JSON格式的文件缓存/预加载Kubernetes元数据，命名为namespace-pod.meta
    # 
    # Kube_meta_preload_cache_dir  

    # DNS_Retries  
    # ============
    # DNS查找重试N次, 直到网络开始工作
    # 默认6 
    #
    # DNS_Retries 6 

    # DNS_Wait_Time  
    # ============
    # DNS间隔
    # 默认30
    #
    # DNS_Wait_Time 30

    # Use_Kubelet  
    # ============
    # 从Kubelet获取元数据信息而不是apiserver.
    # 用于缓解大规模集群的apiserver流量问题。
    # 但kubelet api不确认会不会被移除, 只能用作保留方案
    #
    # Use_Kubelet Off

    # Kubelet_Port  
    # ============
    # kubelet http请求监听端口
    #
    # Kubelet_Port 10250

    # Kubelet_Host  
    # ============
    # kubelet http请求主机
    #
    # Kubelet_Host 127.0.0.1

    
    # Kube_Meta_Cache_TTL  
    # ============
    # kubernetes元数据缓存TTL
    # 默认为0，即缓存数据不做TTL, 达到容量上限后逐步移除数据.
    #
    # Kube_Meta_Cache_TTL 0

    # Kube_Token_TTL  
    # ============
    # kubernetes token TTL
    # 默认为600秒，超过时间将会从Kube_Token_File或Kube_Token_Command重新加载
    #
    # Kube_Token_TTL 600

    # Kube_Token_Command  
    # ============
    # 获取kubernetes token的命令。
    # 默认为NULL, 通过Kube_Token_File来获取
    #
    # Kube_Token_Command NULL

    # Kube_Meta_Namespace_Cache_TTL   
    # ============
    # kubernetes缓存命名空间元数据的可配置TTL. 
    # 默认为900秒, 超过这个时间命名空间缓存的数据将会逐条移除
    # 设置为0，意味着只有当缓存已满时，数据才会随机移除
    #
    # Kube_Meta_Namespace_Cache_TTL  900

    # Namespace_Labels   
    # ============
    # 在额外元数据中包含kubernetes namespace labels
    #
    # Namespace_Labels  Off

    # Namespace_Annotations    
    # ============
    # 在额外元数据中包含kubernetes namespace annotations
    #
    # Namespace_Annotations   Off

    # Namespace_Metadata_Only    
    # ============
    # 在额外元数据中只包含kubernetes namespace元数据, 不包含pod的元数据
    #
    # Namespace_Metadata_Only   Off